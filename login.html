<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <header class="topbar">

    <p class="topbar-title">
        Login Page
    </p>

    <div class="topbar-right">

        <button
            id="themeButton"
            class="theme-button"
            type="button">
            🌙
        </button>

        <p class="topbar-info">
            Semester 3 · Division I<br>
            2026-27 · Odd Term
        </p>

    </div>

    </header>

    <section class="login-content">

        <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72"
             alt="Students">

        <div class="login-box">

            <h2>Welcome Back</h2>

            <form action="login.php" method="POST">
                <div class="form-group">
                    <label for="Username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter Username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="paasword">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" autocomplete="current-password" required>                </div>
                </div>

                <br>
                <div>
                    <br>
                    
                    <button type="submit" class="btn">LOGIN</button>
                    <button type="reset" class="btn">CLEAR</button>
                </div>
            </form>
            <p id="loginMessage" role="status" aria-live="polite"></p>

        </div>

    </section>
    <script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("expired") === "1") {
        document.getElementById("loginMessage").textContent =
            "Your session expired. Please log in again.";
    }
    </script>
    <script src="JS/script.js"></script>
</body>
</html>
