<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <header class="topbar">

    <p class="topbar-title">
        Sign up
    </p>

    <div class="topbar-right">

        <button
            id="themeButton"
            class="theme-button"
            type="button">
            🌙
        </button>

        <p class="topbar-info">
            Semester 3 · Division I<br>
            2026-27 · Odd Term
        </p>

    </div>

</header>

    <section class="login-content">

        <!-- Left Image -->
        <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72"
             alt="Students">

        <!-- Right Sign Up Form -->
        <div class="login-box">

            <h2>Welcome to HUB</h2>

            <form action="dashboard.html">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter USERNAME">
                </div>

                <div class="form-group">
                    <label>ID</label>
                    <input type="text" placeholder="Enter College ID">
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" placeholder="Enter Mobile number (+91)">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter a Password">
                </div>

                <button type="submit" class="btn">SIGN UP</button>
                <button type="reset" class="btn">CLEAR</button>
            </form>

        </div>

    </section>
    <script src="JS/script.js"></script>
</body>
</html>
